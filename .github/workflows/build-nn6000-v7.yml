name: Build NN6000 v7 (v6 + mytvsuper 自动切台, 超频)

# v7 = v6 的全部内容
#      （NSS 满血 / LAN 192.168.5.1 / 硬件流量卸载 / 新 anti-AD / ZeroTier 调通
#       / LAN->ZT IPv6 阻断 / 飞牛 hairpin / 软件源修复 / 恢复出厂锁 1.2GHz）
#      + 新增 mytvsuper-autostart 1.0.0-6：mytv SUPER 开机自动切台
#        电视开机后经 adb 让机顶盒打开指定频道（含 aarch64/x86_64 adb、LuCI 页面）
#        默认 enabled=0 —— 装好但不启动，要用时 uci 或 LuCI 一条命令打开
#
# 注入方式：构建时下载固定 ipk、校验 sha256、解包后并入 files/
#   ipk            1.0.0-6
#   ipk   sha256   c258477d8c2b97f07fc454e25c32de7d0c52b4c0624ffee3e8d798e2aa7eaa36
#   watch.sh sha256 c60ed757fa731eb3040aff9b815161cd6fa15f95fa27eeaa7cd3eba02fc54dec
#   下载地址失效时，重新托管 ipk 并改下面 B2 里的 URL 与 IPK_SHA 即可。
#
# Open-Box 不编进固件，刷完机自己装。
#
# 产物：
#   nn6000-v7-pure-oc   无 WiFi  + 超频
#   nn6000-v7-wifi-oc   带 WiFi  + 超频
on:
  workflow_dispatch:
    inputs:
      lanip:
        description: '默认 LAN IP'
        default: '192.168.5.1'
  push:
    branches: [nn6000]
    paths:
      - 'v7/**'
      - 'v6/**'
      - '.github/workflows/build-nn6000-v7.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [pure, wifi]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    name: nn6000-v7-${{ matrix.variant }}-oc
    steps:
      - uses: actions/checkout@v4

      - name: A 解包 bundle
        run: |
          set -e
          cat nn6000-files.b64.* | base64 -d | tar -xzf - -C .
          cat nn6000-extra.b64.* | base64 -d | tar -xzf - -C .
          echo "解包完成"
          ls -l files/etc/uci-defaults/ | head -20
          wc -c files/usr/lib/lua/luci/view/anti_ad.htm files/usr/lib/lua/luci/controller/anti_ad.lua

      - name: B 覆盖 v3 v4 v5 v6
        run: |
          set -e
          echo "---- 覆盖前 ----"
          wc -c files/usr/lib/lua/luci/view/anti_ad.htm files/usr/lib/lua/luci/controller/anti_ad.lua
          cp -a v3/files/. files/
          cp -a v4/files/. files/
          cp -a v5/files/. files/
          cp -a v6/files/. files/
          chmod 755 files/etc/uci-defaults/*
          echo "---- 覆盖后 ----"
          wc -c files/usr/lib/lua/luci/view/anti_ad.htm files/usr/lib/lua/luci/controller/anti_ad.lua
          ls -l files/etc/nftables.d/ files/etc/uci-defaults/97-nn6000-zt files/etc/apk/repositories.d/distfeeds.list

      - name: B2 注入 mytvsuper-autostart 1.0.0-6
        run: |
          set -e
          IPK_SHA=c258477d8c2b97f07fc454e25c32de7d0c52b4c0624ffee3e8d798e2aa7eaa36
          OK=0
          for u in \
            https://x0.at/bZWH.ipk ; do
            if curl -fsSL --retry 3 --retry-delay 3 --max-time 300 -o /tmp/mtv.ipk "$u"; then
              if echo "$IPK_SHA  /tmp/mtv.ipk" | sha256sum -c - 2>/dev/null; then OK=1; echo "ipk 取到：$u"; break; fi
            fi
            echo "::warning::下载或校验失败：$u"
          done
          [ "$OK" = "1" ] || { echo '::error::所有地址都取不到 mytvsuper ipk，需重新托管'; exit 1; }

          rm -rf /tmp/mtv && mkdir -p /tmp/mtv/d
          tar -xzf /tmp/mtv.ipk -C /tmp/mtv
          tar -xzf /tmp/mtv/data.tar.gz -C /tmp/mtv/d
          ls -l /tmp/mtv/d/usr/libexec/mytvsuper-autostart/adb/

          # 默认不启用：enabled 1 -> 0
          sed -i "s/^\([[:space:]]*option enabled \)'1'$/\1'0'/" /tmp/mtv/d/etc/config/mytvsuper-autostart
          grep -q "option enabled '0'" /tmp/mtv/d/etc/config/mytvsuper-autostart || { echo '::error::默认 enabled 没改成 0'; exit 1; }

          # 首启脚本只修权限与目录，不自动 enable/start
          printf '%s\n' \
            '#!/bin/sh' \
            '# NN6000: 预装 mytvsuper-autostart，默认不启用' \
            '[ -x /etc/init.d/mytvsuper-autostart ] || exit 0' \
            'mkdir -p /var/lib/mytvsuper-autostart' \
            'chmod +x /usr/libexec/mytvsuper-autostart/bin/watch.sh 2>/dev/null' \
            'for f in /usr/libexec/mytvsuper-autostart/adb/adb-*; do [ -f "$f" ] && chmod +x "$f" 2>/dev/null; done' \
            'chmod 600 /usr/libexec/mytvsuper-autostart/keys/adbkey 2>/dev/null' \
            'exit 0' > /tmp/mtv/d/etc/uci-defaults/99-mytvsuper-autostart

          cp -a /tmp/mtv/d/. files/
          chmod 755 files/etc/init.d/mytvsuper-autostart \
                    files/etc/uci-defaults/99-mytvsuper-autostart \
                    files/usr/libexec/mytvsuper-autostart/bin/watch.sh
          chmod 755 files/usr/libexec/mytvsuper-autostart/adb/adb-*
          chmod 644 files/etc/config/mytvsuper-autostart files/usr/libexec/mytvsuper-autostart/keys/adbkey.pub
          chmod 600 files/usr/libexec/mytvsuper-autostart/keys/adbkey

          # 自检：内容哈希 + 权限 + 默认状态
          echo 'c60ed757fa731eb3040aff9b815161cd6fa15f95fa27eeaa7cd3eba02fc54dec  files/usr/libexec/mytvsuper-autostart/bin/watch.sh' | sha256sum -c -
          echo '1d3560b487297ce7d6bac4c34ea5fb89376aa7cbf6eafae7709f5ffd661cab51  files/usr/libexec/mytvsuper-autostart/adb/adb-aarch64-cortex-a53' | sha256sum -c -
          echo '3c8de8c65e9e2af00ad950f7308e7f99c98ca9a747543fb6c0d2a7a8126c4423  files/usr/libexec/mytvsuper-autostart/adb/adb-aarch64-generic' | sha256sum -c -
          test -x files/usr/libexec/mytvsuper-autostart/bin/watch.sh
          test -x files/usr/libexec/mytvsuper-autostart/adb/adb-aarch64-cortex-a53
          test -x files/usr/libexec/mytvsuper-autostart/adb/adb-x86_64
          test -x files/usr/libexec/mytvsuper-autostart/adb/adb-aarch64-generic
          test -s files/etc/config/mytvsuper-autostart
          test -s files/usr/lib/lua/luci/controller/mytvsuper-autostart.lua
          test -s files/usr/lib/lua/luci/model/cbi/mytvsuper-autostart/settings.lua
          if grep -q 'init.d/mytvsuper-autostart enable' files/etc/uci-defaults/99-mytvsuper-autostart; then
            echo '::error::99 仍会自动 enable 服务'; exit 1
          fi
          echo "B2_OK  rootfs +$(du -sk files/usr/libexec/mytvsuper-autostart | cut -f1)KB"

      - name: C 改 ci/build.sh
        run: |
          set -e
          # ci/build.sh 第 0 步自己还会解包一次，会把 files/ 盖回旧版。
          # 禁用成 `true -C .`：true 忽略参数、恒返回 0，不影响 set -e。
          sed -i 's#^tar -xzf /tmp/nn-files.tgz#true#' ci/build.sh
          grep -q '^true ' ci/build.sh || { echo '::error::build.sh 内部解包未禁用'; exit 1; }
          if grep -q '^tar -xzf /tmp/nn-files.tgz' ci/build.sh; then
            echo '::error::build.sh 里还有解包命令'; exit 1
          fi
          # 旧 chk 断言针对 bundle 里的旧页面，覆盖后必然不符 -> 停用
          sed -i -E 's/^chk [0-9a-f]{64} /# chk /' ci/build.sh
          cnt=$(grep -c '^# chk ' ci/build.sh || true)
          echo "已停用 chk：$cnt 条"
          [ "$cnt" = "5" ] || { echo "::error::chk 断言停用失败（$cnt）"; exit 1; }

      - name: D 校验 v3 文件
        run: |
          set -e
          echo "v3/SHA256SUMS 共 $(wc -l < v3/SHA256SUMS) 条"
          sha256sum -c v3/SHA256SUMS

      - name: E 校验 v6 文件与内容
        run: |
          set -e
          {
            echo 'd200705dd0713a30a849169d4f75a2f7896df00fdef646a70751f2c4a600e369  files/etc/uci-defaults/97-nn6000-zt'
            echo '452b79263ce540ee8dab22ed1f2603ee40710f63d07a580bbfb255b634a8ca87  files/etc/nftables.d/95-lan-nas-hairpin.nft'
            echo '43d0dffed91a679a26f155f3b6b1b81b224d636efa9b23a0e6059099cc08b7c6  files/etc/apk/repositories.d/distfeeds.list'
          } | sha256sum -c -

          test -x files/etc/uci-defaults/97-nn6000-zt || { echo '::error::97 没有执行位'; exit 1; }
          for pat in ztklh54jiv nolan2zt6 Block-LAN-to-ZT-IPv6 6ab565387abb1d6f nn6000-zt-guard.sh 'lookup main pref 100'; do
            grep -q "$pat" files/etc/uci-defaults/97-nn6000-zt || { echo "::error::97 里缺少：$pat"; exit 1; }
          done
          # v6 核心修复：ZT 网络 ID 必须是值比较，不能是存在性判断
          if grep -q '! uci -q get zerotier.earth.id' files/etc/uci-defaults/97-nn6000-zt; then
            echo '::error::97 里还有 v5 的旧存在性判断'; exit 1
          fi
          grep -q 'uci -q get zerotier.earth.id' files/etc/uci-defaults/97-nn6000-zt || { echo '::error::97 缺 ZT id 判断'; exit 1; }
          grep -q 'zerotier.earth.enabled' files/etc/uci-defaults/97-nn6000-zt || { echo '::error::97 没显式启用 ZT 网络'; exit 1; }

          test -s files/etc/nftables.d/95-lan-nas-hairpin.nft || { echo '::error::hairpin 规则文件缺失'; exit 1; }
          for pat in 192.168.192.64 192.168.5.50 lan_nas_hairpin_snat 0x514e; do
            grep -q "$pat" files/etc/nftables.d/95-lan-nas-hairpin.nft || { echo "::error::hairpin 规则缺少：$pat"; exit 1; }
          done

          n=$(grep -c '^# https://mirrors.vsean.net' files/etc/apk/repositories.d/distfeeds.list || true)
          [ "$n" = "3" ] || { echo "::error::软件源注释数不对（$n != 3）"; exit 1; }
          a=$(grep -c '^https://' files/etc/apk/repositories.d/distfeeds.list || true)
          [ "$a" = "6" ] || { echo "::error::有效源数量不对（$a != 6）"; exit 1; }
          echo "E_OK"

      - name: F 生成前自检
        run: |
          set -e
          bash -n ci/build.sh
          echo "build.sh 语法 OK"
          echo "---- 最终 files/ ----"
          find files -type f | sort

      - name: 派生 WiFi 变体
        if: matrix.variant == 'wifi'
        run: |
          set -e
          cp configs/nn6000-pure.config configs/nn6000-wifi.config
          # 1) WiFi 相关包 =n -> =y（先定行，再把行尾的 =n 换成 =y）
          sed -i -E '/^(CONFIG_PACKAGE_(kmod-ath|kmod-mac80211|kmod-cfg80211|ath11k|ipq-wifi|wpad|hostapd)[A-Za-z0-9_.-]*)=n$/s/=n$/=y/' configs/nn6000-wifi.config
          sed -i 's/^CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=n/CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=y/' configs/nn6000-wifi.config
          # wpad 三个变体互斥，只留 openssl
          sed -i 's/^CONFIG_PACKAGE_wpad-mbedtls=y/CONFIG_PACKAGE_wpad-mbedtls=n/;s/^CONFIG_PACKAGE_wpad-basic-mbedtls=y/CONFIG_PACKAGE_wpad-basic-mbedtls=n/' configs/nn6000-wifi.config
          {
            echo 'CONFIG_PACKAGE_iw-full=y'
            echo 'CONFIG_PACKAGE_iwinfo=y'
          } >> configs/nn6000-wifi.config
          # 2) 让 build.sh 读 wifi 配置
          sed -i 's#configs/nn6000-pure.config#configs/nn6000-wifi.config#' ci/build.sh
          # 3) 关掉「无 WiFi」禁令与残留检查（按行号定点改，改完下面逐条验证）
          sed -i '149s/^forbid() {/forbid() { return 0;/' ci/build.sh
          sed -i '201s/^for pat in .*/for pat in __none__; do/' ci/build.sh
          sed -i '210s/^if .*/if false; then/' ci/build.sh

          grep -E '^CONFIG_PACKAGE_(kmod-ath|kmod-mac|ath11k|ipq-wifi|wpad|hostapd|iw)' configs/nn6000-wifi.config
          grep -q '^forbid() { return 0;' ci/build.sh || { echo '::error::forbid 改写未生效'; exit 1; }
          grep -q '^for pat in __none__; do' ci/build.sh || { echo '::error::残留检查改写未生效'; exit 1; }
          grep -q '^if false; then' ci/build.sh || { echo '::error::wireless 检查改写未生效'; exit 1; }
          grep -q 'configs/nn6000-wifi.config' ci/build.sh || { echo '::error::配置路径未替换'; exit 1; }
          bash -n ci/build.sh
          echo DERIVE_OK

      - name: 构建（约 100 分钟）
        env:
          OCHIGH: 'yes'
          LANIP: ${{ inputs.lanip || '192.168.5.1' }}
        run: bash ci/build.sh

      - name: 校验固件内容
        run: |
          set -e
          R=$(ls -d openwrt/build_dir/target-*/root-* | head -1)
          echo "rootfs: $R"

          # anti-AD 新版页面
          wc -c "$R/usr/lib/lua/luci/view/anti_ad.htm"
          grep -q 'anti-ad-schedule show' "$R/usr/lib/lua/luci/view/anti_ad.htm" || { echo '::error::新 anti-AD 页面没进固件（还是旧版）'; exit 1; }
          grep -q 'del:' "$R/usr/lib/lua/luci/controller/anti_ad.lua" || { echo '::error::新版 controller 没进固件'; exit 1; }

          # ZeroTier 首启脚本
          test -x "$R/etc/uci-defaults/97-nn6000-zt" || { echo '::error::97 丢了执行位'; exit 1; }
          for pat in ztklh54jiv nolan2zt6 6ab565387abb1d6f nn6000-zt-guard.sh; do
            grep -q "$pat" "$R/etc/uci-defaults/97-nn6000-zt" || { echo "::error::固件里的 97 缺少：$pat"; exit 1; }
          done
          if grep -q '! uci -q get zerotier.earth.id' "$R/etc/uci-defaults/97-nn6000-zt"; then
            echo '::error::固件里的 97 还是旧的存在性判断'; exit 1
          fi

          # hairpin 规则
          test -s "$R/etc/nftables.d/95-lan-nas-hairpin.nft" || { echo '::error::hairpin 规则没进固件'; exit 1; }
          grep -q '192.168.5.50' "$R/etc/nftables.d/95-lan-nas-hairpin.nft" || { echo '::error::hairpin 规则内容不对'; exit 1; }

          # 软件源
          n=$(grep -c '^# https://mirrors.vsean.net' "$R/etc/apk/repositories.d/distfeeds.list" || true)
          [ "$n" = "3" ] || { echo "::error::固件里软件源注释数不对（$n）"; exit 1; }
          echo "软件源：6 个有效 + 3 个已注释"

          # 纯有线版必须没有 WiFi 残留
          if [ "${{ matrix.variant }}" = "pure" ]; then
            for pat in ath11k.ko mac80211.ko cfg80211.ko wpad hostapd; do
              if find "$R" -name "*${pat}*" | grep -q .; then
                echo "::error::pure 版有 WiFi 残留：$pat"; exit 1
              fi
            done
            if [ -e "$R/etc/config/wireless" ]; then
              echo '::error::pure 版有 wireless 配置'; exit 1
            fi
          fi
          # mytvsuper-autostart 1.0.0-6
          test -x "$R/usr/libexec/mytvsuper-autostart/bin/watch.sh" || { echo '::error::watch.sh 没进固件或丢执行位'; exit 1; }
          test -x "$R/usr/libexec/mytvsuper-autostart/adb/adb-aarch64-cortex-a53" || { echo '::error::adb aarch64 没进固件'; exit 1; }
          test -s "$R/etc/config/mytvsuper-autostart" || { echo '::error::mytvsuper 配置没进固件'; exit 1; }
          grep -q "option enabled '0'" "$R/etc/config/mytvsuper-autostart" || { echo '::error::mytvsuper 默认不是关闭'; exit 1; }
          test -x "$R/etc/init.d/mytvsuper-autostart" || { echo '::error::mytvsuper init 没进固件'; exit 1; }
          test -s "$R/usr/lib/lua/luci/controller/mytvsuper-autostart.lua" || { echo '::error::mytvsuper LuCI 页面没进固件'; exit 1; }
          echo "mytvsuper：watch.sh + 3 个 adb + LuCI 页面已就位，默认关闭"

          echo CONTENT_OK

      - name: 标注产物名
        run: |
          set -e
          cd out
          ls -lh
          for f in *sysupgrade.bin; do
            [ -e "$f" ] || continue
            mv "$f" "nn6000-v7-${{ matrix.variant }}-oc-sysupgrade.bin"
          done
          sha256sum *sysupgrade.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v7-${{ matrix.variant }}-oc
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v7-${{ matrix.variant }}-oc-diag
          path: |
            build.log
            config-snapshot.txt
            result.config
          if-no-files-found: warn
          retention-days: 15
