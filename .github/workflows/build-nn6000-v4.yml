name: Build NN6000 v4 (新 anti-AD + ZeroTier, 超频)

# v4 = v3 的全部内容（NSS 满血 / LAN 192.168.5.1 / 硬件流量卸载 1/1 / 新 anti-AD 页面）
#      + ZeroTier 首启防火墙配置（zt zone + zt<->lan 转发 + 解掉 dropbear 的 br-lan 绑定）
#      + 两路产物：纯有线 / 带 WiFi，都固定超频 1.32/1.44/1.512GHz
#
# Open-Box 不编进固件，刷完机自己装。
#
# 产物：
#   nn6000-v4-pure-oc   无 WiFi  + 超频
#   nn6000-v4-wifi-oc   带 WiFi  + 超频
on:
  workflow_dispatch:
    inputs:
      lanip:
        description: '默认 LAN IP'
        default: '192.168.5.1'
  push:
    branches: [nn6000]
    paths:
      - 'v4/**'
      - '.github/workflows/build-nn6000-v4.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [pure, wifi]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    name: nn6000-v4-${{ matrix.variant }}-oc
    steps:
      - uses: actions/checkout@v4

      - name: 解包 + 覆盖 + 校验
        run: |
          set -e
          cat nn6000-files.b64.* | base64 -d | tar -xzf - -C .
          cat nn6000-extra.b64.* | base64 -d | tar -xzf - -C .

          echo "---- 覆盖前 anti-AD 页面 ----"
          wc -c files/usr/lib/lua/luci/view/anti_ad.htm files/usr/lib/lua/luci/controller/anti_ad.lua

          cp -a v3/files/. files/
          cp -a v4/files/. files/
          chmod 755 files/etc/uci-defaults/*

          echo "---- 覆盖后 ----"
          wc -c files/usr/lib/lua/luci/view/anti_ad.htm files/usr/lib/lua/luci/controller/anti_ad.lua

          # 关键：ci/build.sh 第 0 步自己还会解包一次，会把 files/ 盖回旧版，
          # 新页面就白做了（上一轮 40143837277 正是栽在这里）。换成再覆盖一遍。
          sed -i 's#^tar -xzf /tmp/nn-files.tgz -C \.$#cp -a v3/files/. files/; cp -a v4/files/. files/; chmod 755 files/etc/uci-defaults/*#' ci/build.sh
          grep -q '^cp -a v3/files/. files/; cp -a v4/files/. files/' ci/build.sh \
            || { echo '::error::build.sh 内部解包未替换'; exit 1; }

          # 旧 chk 断言针对 bundle 里的旧页面，覆盖后必然不符 -> 停用，
          # 改由 v3/SHA256SUMS + 97 脚本单独校验兜底
          sed -i -E 's/^chk [0-9a-f]{64} /# chk /' ci/build.sh
          [ "$(grep -c '^# chk ' ci/build.sh)" = "5" ] || { echo '::error::chk 断言停用失败'; exit 1; }

          sha256sum -c v3/SHA256SUMS
          echo "c413092948cc256641c9cb0476357ad8134d836c9c55ed19c6d5b925c264cf2f  files/etc/uci-defaults/97-nn6000-zt" | sha256sum -c -
          test -x files/etc/uci-defaults/97-nn6000-zt || { echo '::error::97-nn6000-zt 没有执行位'; exit 1; }
          grep -q 'ztklh54jiv' files/etc/uci-defaults/97-nn6000-zt || { echo '::error::97 内容不对'; exit 1; }

          bash -n ci/build.sh
          echo "---- 最终 files/ ----"
          find files -type f | sort

      - name: 派生 WiFi 变体
        if: matrix.variant == 'wifi'
        run: |
          set -e
          cp configs/nn6000-pure.config configs/nn6000-wifi.config
          # 1) WiFi 相关包 =n -> =y
          sed -i -E 's/^(CONFIG_PACKAGE_(kmod-ath|kmod-mac80211|kmod-cfg80211|ath11k|ipq-wifi|wpad|hostapd)[A-Za-z0-9_.-]*)=n$/\1=y/' configs/nn6000-wifi.config
          sed -i 's/^CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=n/CONFIG_PACKAGE_kmod-qca-nss-drv-wifi-meshmgr=y/' configs/nn6000-wifi.config
          # wpad 三个变体互斥，只留 openssl
          sed -i 's/^CONFIG_PACKAGE_wpad-mbedtls=y/CONFIG_PACKAGE_wpad-mbedtls=n/;s/^CONFIG_PACKAGE_wpad-basic-mbedtls=y/CONFIG_PACKAGE_wpad-basic-mbedtls=n/' configs/nn6000-wifi.config
          printf 'CONFIG_PACKAGE_iw-full=y\nCONFIG_PACKAGE_iwinfo=y\n' >> configs/nn6000-wifi.config
          # 2) 让 build.sh 读 wifi 配置
          sed -i 's#configs/nn6000-pure.config#configs/nn6000-wifi.config#' ci/build.sh
          # 3) 关掉“无 WiFi”禁令与残留检查，否则必然 fail
          sed -i 's/^forbid() {/forbid() { return 0;/' ci/build.sh
          sed -i 's|^for pat in ath11k\.ko.*$|for pat in __none__; do|' ci/build.sh
          sed -i 's|^if \[ -e "\$R/etc/config/wireless" \]; then|if false; then|' ci/build.sh

          grep -E '^CONFIG_PACKAGE_(kmod-ath|kmod-mac|ath11k|ipq-wifi|wpad|hostapd|iw)' configs/nn6000-wifi.config
          grep -q 'forbid() { return 0;' ci/build.sh || { echo '::error::forbid 改写未生效'; exit 1; }
          grep -q 'for pat in __none__' ci/build.sh || { echo '::error::残留检查改写未生效'; exit 1; }
          grep -q 'if false; then' ci/build.sh || { echo '::error::wireless 检查改写未生效'; exit 1; }
          grep -q 'configs/nn6000-wifi.config' ci/build.sh || { echo '::error::配置路径未替换'; exit 1; }
          bash -n ci/build.sh
          echo DERIVE_OK

      - name: 构建（约 100 分钟）
        env:
          OCHIGH: 'yes'
          LANIP: ${{ inputs.lanip || '192.168.5.1' }}
        run: bash ci/build.sh

      - name: 校验固件内容
        run: |
          set -e
          R=$(ls -d openwrt/build_dir/target-*/root-* | head -1)
          echo "rootfs: $R"
          wc -c "$R/usr/lib/lua/luci/view/anti_ad.htm"
          grep -q 'anti-ad-schedule show' "$R/usr/lib/lua/luci/view/anti_ad.htm" \
            || { echo '::error::新 anti-AD 页面没进固件（还是旧版）'; exit 1; }
          grep -q 'del:' "$R/usr/lib/lua/luci/controller/anti_ad.lua" \
            || { echo '::error::新版 controller 没进固件'; exit 1; }
          test -s "$R/etc/uci-defaults/97-nn6000-zt" || { echo '::error::ZT 首启脚本没进固件'; exit 1; }
          test -x "$R/etc/uci-defaults/97-nn6000-zt" || { echo '::error::ZT 首启脚本丢了执行位'; exit 1; }
          grep -q 'ztklh54jiv' "$R/etc/uci-defaults/97-nn6000-zt" || { echo '::error::ZT 首启脚本内容不对'; exit 1; }
          # 纯有线版必须没有 WiFi 残留（build.sh 已检查，这里再兜一层）
          if [ "${{ matrix.variant }}" = "pure" ]; then
            for pat in ath11k.ko mac80211.ko cfg80211.ko wpad hostapd; do
              if find "$R" -name "*${pat}*" | grep -q .; then
                echo "::error::pure 版有 WiFi 残留：$pat"; exit 1
              fi
            done
            [ ! -e "$R/etc/config/wireless" ] || { echo '::error::pure 版有 wireless 配置'; exit 1; }
          fi
          echo CONTENT_OK

      - name: 标注产物名
        run: |
          set -e
          cd out
          ls -lh
          for f in *sysupgrade.bin; do
            [ -e "$f" ] || continue
            mv "$f" "nn6000-v4-${{ matrix.variant }}-oc-sysupgrade.bin"
          done
          sha256sum *sysupgrade.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v4-${{ matrix.variant }}-oc
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v4-${{ matrix.variant }}-oc-diag
          path: |
            build.log
            config-snapshot.txt
            result.config
          if-no-files-found: warn
          retention-days: 15
