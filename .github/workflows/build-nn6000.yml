# ==========================================================
#  NN6000 v2 云编译（IPQ6000 / qualcommax-ipq60xx）
#
#  源码：laipeng668/openwrt-6.x  分支 25.12-nss
#        = ImmortalWrt 25.12 + qosmio 全套 NSS。qualcommax/Makefile 的
#          DEFAULT_PACKAGES 里已写死 kmod-qca-nss-dp / drv / ecm /
#          bridge-mgr 等，NSS 默认就是满血的。
#
#  为什么自己编：官方 snapshot 的 kmods 只留最近几个内核版本，设备现用
#  的 6.12.45 的 kmod 已被上游删除，kmod-tun 装不上；而 Open-Box 只有
#  tun 一种转发方式，没 tun 核心直接起不来。编进固件最干净。
#
#  单变体：NSS + TUN + Open-Box + ShadowSocksR Plus+（不含 passwall）
#  只在 nn6000 分支触发，不影响 main 上的 JDCloud 构建。
# ==========================================================

name: Build NN6000 v2 (NSS + TUN)

on:
  workflow_dispatch:
    inputs:
      oc1512:
        description: '放开 1.512GHz 超频档'
        type: choice
        options: ['yes', 'no']
        default: 'yes'
  push:
    branches: [nn6000]
    paths:
      - 'configs/nn6000-*.config'
      - '.github/workflows/build-nn6000.yml'

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  SRC_REPO: https://github.com/laipeng668/openwrt-6.x.git
  SRC_BRANCH: 25.12-nss

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        variant: [core]
    name: nn6000-v2 / ${{ matrix.variant }}

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/lib/node_modules /opt/az /usr/share/swift "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get -qq clean
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get -y -qq install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools python3-venv rsync swig unzip zip zlib1g-dev file wget ccache time libgmp3-dev libmpc-dev
          df -h /

      - name: 克隆源码
        run: |
          git clone --depth 1 -b "$SRC_BRANCH" "$SRC_REPO" openwrt
          cd openwrt
          echo "源码提交: $(git rev-parse --short HEAD)"
          grep -m1 '^LINUX_VERSION-6.12' include/kernel-6.12 || echo "内核版本未知"

      - name: 更新基础 feeds
        run: |
          set -o pipefail
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tail -15
          ./scripts/feeds install -a 2>&1 | tail -5
          echo "----- nss_packages feed -----"
          ls package/feeds/nss_packages 2>/dev/null | head -10 || echo "未找到 nss_packages"

      - name: 追加 helloworld 源（ssr-plus 来源，失败不阻断）
        run: |
          cd openwrt
          echo "src-git helloworld https://github.com/fw876/helloworld.git" >> feeds.conf.default
          ./scripts/feeds update helloworld 2>&1 | tail -8 || echo "::warning::helloworld 更新失败，将产出无 ssr-plus 的固件"
          ./scripts/feeds install -a -p helloworld 2>&1 | tail -8 || echo "::warning::helloworld 安装失败，将产出无 ssr-plus 的固件"
          echo "----- helloworld 包目录 -----"
          ls package/feeds/helloworld 2>/dev/null | head -10 || echo "helloworld 未就位"

      - name: 放开 1.512GHz OPP（超频档）
        if: inputs.oc1512 != 'no'
        run: |
          cd openwrt
          DTS=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6000-nn6000-v2.dts
          if [ ! -f "$DTS" ]; then echo "::error::找不到 $DTS"; exit 1; fi
          printf '\n/* 超频：放开 1.512GHz 档。原生 opp 表把该条目标为 speed-bin v1(0x2)，\n * 而 IPQ6000 的 bin 是 v2(0x4)，opp 子系统据此把它过滤掉，导致\n * scaling_available_frequencies 里只有 864/1056/1200。改为 0xf 让所有 bin\n * 都能看到这一档。散热需注意，NSS 转发不依赖 CPU 频率。 */\n&cpu_opp_table {\n\topp-1512000000 {\n\t\topp-supported-hw = <0xf>;\n\t};\n};\n' >> "$DTS"
          echo "----- dts 尾部 -----"
          tail -10 "$DTS"

      - name: 套用配置
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/configs/nn6000-${{ matrix.variant }}.config" .config
          mkdir -p package/base-files/files/etc/uci-defaults
          TARGET_UCI=package/base-files/files/etc/uci-defaults/99-nn6000
          echo '#!/bin/sh' > $TARGET_UCI
          echo 'uci -q get luci.main >/dev/null 2>&1 || uci set luci.main=core' >> $TARGET_UCI
          echo "uci -q set luci.main.mediaurlbase='/luci-static/argon'" >> $TARGET_UCI
          echo "uci -q set luci.main.lang='zh_cn'" >> $TARGET_UCI
          echo 'uci commit luci 2>/dev/null' >> $TARGET_UCI
          echo 'exit 0' >> $TARGET_UCI
          chmod +x $TARGET_UCI
          make defconfig
          cp .config "$GITHUB_WORKSPACE/nn6000-${{ matrix.variant }}.result.config"

      - name: 导出配置快照（便于远程诊断）
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/reports"
          OUT="$GITHUB_WORKSPACE/reports/config-${{ matrix.variant }}.txt"
          echo "# nn6000-${{ matrix.variant }} 的 .config 关键行" > "$OUT"
          echo "# 生成时间 $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$OUT"
          echo "==== 目标/设备 ====" >> "$OUT"
          grep -E "^CONFIG_TARGET" .config >> "$OUT" 2>/dev/null || echo "(无)" >> "$OUT"
          echo "==== 内核能力 ====" >> "$OUT"
          grep -E "^CONFIG_PACKAGE_kmod-(tun|veth|nft-queue|nft-tproxy|nft-nat|nft-socket|nfnetlink-queue)=" .config >> "$OUT" 2>/dev/null || echo "(无)" >> "$OUT"
          echo "==== NSS ====" >> "$OUT"
          grep -E "^CONFIG_PACKAGE_(kmod-qca-nss|kmod-nss-ifb)" .config >> "$OUT" 2>/dev/null || echo "(无)" >> "$OUT"
          echo "==== 其他 ====" >> "$OUT"
          grep -E "^CONFIG_PACKAGE_(ip-full|dnsmasq-full|luci-app-passwall|luci-app-ssr-plus|luci-theme-argon|luci-app-ttyd)=" .config >> "$OUT" 2>/dev/null || echo "(无)" >> "$OUT"
          echo "==== 未选中的相关项 ====" >> "$OUT"
          grep -E "^# CONFIG_PACKAGE_(kmod-(tun|veth|nft-queue|nft-tproxy)|kmod-qca-nss|luci-app-ssr-plus) " .config >> "$OUT" 2>/dev/null || echo "(无)" >> "$OUT"
          cat "$OUT"

      - name: 关键能力自检
        run: |
          cd openwrt
          fail=0
          chk() {
            if grep -qE "^$1=(y|m)$" .config; then
              echo "  OK   $1"
            else
              echo "  MISS $1"
              fail=1
            fi
          }
          echo "---------- 目标设备 ----------"
          chk CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_link_nn6000-v2
          echo "---------- Open-Box 必需 ----------"
          chk CONFIG_PACKAGE_kmod-tun
          chk CONFIG_PACKAGE_kmod-veth
          chk CONFIG_PACKAGE_kmod-nft-queue
          chk CONFIG_PACKAGE_kmod-nft-tproxy
          chk CONFIG_PACKAGE_ip-full
          echo "---------- NSS 全套（缺一个就没有硬件加速）----------"
          chk CONFIG_PACKAGE_kmod-qca-nss-dp
          chk CONFIG_PACKAGE_kmod-qca-nss-drv
          chk CONFIG_PACKAGE_kmod-qca-nss-ecm
          chk CONFIG_PACKAGE_kmod-qca-nss-drv-bridge-mgr
          echo "---------- 软件 ----------"
          for p in luci-theme-argon luci-app-ttyd; do
            if grep -qE "^CONFIG_PACKAGE_$p=(y|m)$" .config; then
              echo "  OK   $p"
            else
              echo "  WARN $p 未选中（不阻断）"
            fi
          done
          echo "---------- 代理：ssr-plus 要、passwall 不要 ----------"
          if grep -qE "^CONFIG_PACKAGE_luci-app-passwall=(y|m)$" .config; then
            echo "  FAIL passwall 混进来了（用户明确不要）"
            grep -E "^CONFIG_PACKAGE_luci-app-passwall" .config
            fail=1
          else
            echo "  OK   无 passwall"
          fi
          if grep -qE "^CONFIG_PACKAGE_luci-app-ssr-plus=(y|m)$" .config; then
            echo "  OK   luci-app-ssr-plus"
          else
            echo "  WARN ssr-plus 未进入配置（helloworld 可能没就位，产出无代理固件）"
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::关键能力缺失，终止编译（避免编出没有 tun 或没有 NSS 的废固件）"
            exit 1
          fi
          echo "自检通过"

      - name: 下载源码包
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(nproc)" download 2>&1 | tail -30 || make -j1 V=s download 2>&1 | tail -50

      - name: 编译固件
        run: |
          set -o pipefail
          cd openwrt
          make -j"$(( $(nproc) + 1 ))" 2>&1 | tee "$GITHUB_WORKSPACE/build-${{ matrix.variant }}.log" | tail -150

      - name: 收集产物
        if: success()
        run: |
          OUT="$GITHUB_WORKSPACE/out-${{ matrix.variant }}"
          mkdir -p "$OUT"
          cd openwrt/bin/targets/qualcommax/ipq60xx
          ls -lh
          cp -v *.bin "$OUT/" 2>/dev/null || true
          cp -v sha256sums profiles.json "$OUT/" 2>/dev/null || true
          cp -v "$GITHUB_WORKSPACE/nn6000-${{ matrix.variant }}.result.config" "$OUT/" || true
          echo "===== 最终产物 ====="
          ls -lh "$OUT"
          ls "$OUT"/*nn6000-v2*.bin >/dev/null 2>&1 || echo "::error::没有产出 nn6000-v2 的 .bin"

      - name: 上传固件
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v2-${{ matrix.variant }}
          path: out-${{ matrix.variant }}/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v2-${{ matrix.variant }}-log
          path: |
            build-${{ matrix.variant }}.log
            nn6000-${{ matrix.variant }}.result.config

      - name: 回传诊断快照（总是执行）
        if: always()
        run: |
          mkdir -p reports
          ls -la "$GITHUB_WORKSPACE/reports" 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/reports/"*.txt reports/ 2>/dev/null || true
          cp -f "$GITHUB_WORKSPACE/nn6000-${{ matrix.variant }}.result.config" reports/ 2>/dev/null || true
          ls -la reports/ || true
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A reports/ 2>/dev/null || true
          git commit -m "diag: nn6000-${{ matrix.variant }} 配置快照" || echo "没有需要提交的改动"
          for i in 1 2 3; do
            if git pull --rebase origin nn6000 && git push origin HEAD:nn6000; then
              echo "诊断已回传"
              break
            fi
            echo "第 $i 次回传失败，重试"
            sleep 5
          done
