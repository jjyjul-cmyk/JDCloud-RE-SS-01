name: Build NN6000 v2 (wired NSS + anti-AD)

# 入口只做三件事：解包（base64 分片，避免中文/引号在传输中失真）、跑 ci/build.sh、收产物。
# 全部编译逻辑在 ci/build.sh 里（同样以分片形式随仓库携带）。
on:
  workflow_dispatch:
    inputs:
      ochigh:
        description: '超频 1.32/1.44/1.512GHz (yes/no，push 触发默认 yes)'
        default: 'yes'
      lanip:
        description: '默认 LAN IP'
        default: '192.168.5.1'
  push:
    branches: [nn6000]
    paths:
      - 'ci/**'
      - 'configs/nn6000-pure.config'
      - 'files/**'
      - '.github/workflows/build-nn6000.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    name: nn6000-v2 / pure
    steps:
      - uses: actions/checkout@v4

      - name: 解包
        run: |
          cat nn6000-files.b64.* | base64 -d | tar -xzf - -C .
          cat nn6000-extra.b64.* | base64 -d | tar -xzf - -C .
          ls -l ci/build.sh
          find files -type f | sort

      - name: 构建
        env:
          OCHIGH: ${{ inputs.ochigh || 'yes' }}
          LANIP: ${{ inputs.lanip }}
        run: bash ci/build.sh

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v2-pure-oc
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn6000-v2-pure-oc-diag
          path: |
            build.log
            config-snapshot.txt
            result.config
          if-no-files-found: warn
          retention-days: 15
